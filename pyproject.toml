[project]
name = "fq"
version = "0.1.0"
description = "Global value and quality equity screener: resilient Yahoo Finance ingestion, deterministic scoring, an LLM-graded judgement layer and a static site"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "JAlvarezRomario", email = "44770110+JAlvarezRomario@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.34.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "scrapy>=2.20.0",
    "typer>=0.27.3",
    "yfinance>=1.7.0",
]

[project.scripts]
fq = "fq.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
